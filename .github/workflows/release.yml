name: Release

# Manual only. Releasing is deliberate here: the pack pins an exact compat
# version, and a jar whose internal version does not match its tag is the
# "mms-deploy ships nothing" failure mode all over again. See the version
# check below.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.1.0) — must already match mod_version in gradle.properties"
        required: true
        type: string
      prerelease:
        description: "Mark the GitHub release as a pre-release"
        required: false
        type: boolean
        default: false
      dry_run:
        description: "Build and validate only — do not tag or publish"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # The invariant worth protecting is "the jar's internal version equals its
      # tag" — not "a human already edited gradle.properties". So the requested
      # version is authoritative: if gradle.properties disagrees, bump it here
      # and commit, rather than failing and making the release a two-step dance.
      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          INPUT="${{ inputs.version }}"
          if [[ ! "$INPUT" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "ERROR: invalid version '$INPUT'. Expected X.Y.Z"
            exit 1
          fi

          if [ -z "${LIBS_KEY:-}" ]; then
            echo "ERROR: secret MMS_LIBS_SSH_KEY is not set."
            echo
            echo "This repo gitignores libs/ on purpose — those jars are other"
            echo "projects' redistributables under their own licenses. CI reads"
            echo "them from the private mudbourn/mms-libs repo, via a read-only"
            echo "deploy key exposed here as MMS_LIBS_SSH_KEY."
            exit 1
          fi

          if gh release view "v${INPUT}" >/dev/null 2>&1; then
            echo "ERROR: release v${INPUT} already exists."
            echo "Pick a new version, or use dry_run to rebuild without publishing."
            exit 1
          fi

          DECLARED=$(grep -E '^mod_version=' gradle.properties | cut -d= -f2- | tr -d '[:space:]')
          if [[ "$INPUT" == "$DECLARED" ]]; then
            echo "gradle.properties already at $INPUT."
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          NEWEST=$(printf '%s\n%s\n' "$INPUT" "$DECLARED" | sort -V | tail -1)
          if [[ "$NEWEST" != "$INPUT" ]]; then
            echo "ERROR: $INPUT is older than gradle.properties ($DECLARED)."
            exit 1
          fi

          echo "Bumping mod_version: $DECLARED -> $INPUT"
          sed -i -E "s|^mod_version=.*|mod_version=${INPUT}|" gradle.properties
          grep -E '^mod_version=' gradle.properties
          echo "bumped=true" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIBS_KEY: ${{ secrets.MMS_LIBS_SSH_KEY }}

      # libs/ is gitignored on purpose: those jars are other projects'
      # redistributables under their own licenses, and several are ARR. They
      # live in a private companion repo so this public MIT repo never carries
      # them and CI can still compile.
      - name: Check out compile-only libraries
        uses: actions/checkout@v5
        with:
          repository: mudbourn/mms-libs
          ssh-key: ${{ secrets.MMS_LIBS_SSH_KEY }}
          path: .mms-libs

      - name: Stage libs/
        run: |
          set -euo pipefail
          mkdir -p libs
          cp .mms-libs/mms-jobs/*.jar libs/
          echo "Staged $(ls libs | wc -l) jars."

      # Version skew in libs/ surfaces as confusing mixin failures at runtime
      # rather than build errors, so fail loudly and early instead.
      - name: Verify every referenced jar is present
        run: |
          set -euo pipefail
          MISSING=0
          while read -r jar; do
            if [ ! -f "libs/$jar" ]; then
              echo "MISSING: libs/$jar"
              MISSING=1
            fi
          done < <(grep -oE 'files\("libs/[^"]+\.jar"\)' build.gradle \
                   | sed -E 's|files\("libs/||; s|"\)||')
          if [ "$MISSING" -ne 0 ]; then
            echo
            echo "build.gradle references jars that mms-libs does not provide."
            echo "Update the private mms-libs repo to match, versions exactly."
            exit 1
          fi
          echo "All referenced jars present."

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --no-daemon --stacktrace

      - name: Collect artifacts
        id: collect
        run: |
          set -euo pipefail
          mkdir -p dist
          # Loom leaves the unremapped and dev jars alongside the real one.
          find build/libs -maxdepth 1 -name '*.jar' \
            ! -name '*-dev.jar' \
            ! -name '*-dev-shadow.jar' \
            -exec cp {} dist/ \;
          ls -la dist
          test -n "$(ls -A dist)" || { echo "ERROR: no jars produced"; exit 1; }

      # Deliberately after the build. Committing the bump up front means a
      # failed build leaves main claiming a version that has no release.
      - name: Commit version bump
        if: ${{ steps.version.outputs.bumped == 'true' && !inputs.dry_run }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle.properties
          git commit -m "Bump version to ${{ inputs.version }}"
          git push origin HEAD:${{ github.ref_name }}
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        id: bumpcommit

      # A dry run still builds and still enforces the version check, so it can
      # be re-run against the current released version without burning a new
      # one. Artifacts land on the run instead of on a release.
      - name: Upload artifacts (dry run)
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: mms-jobs-${{ inputs.version }}
          path: dist/*.jar

      - name: Publish release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          FLAGS=(--generate-notes --title "mms-jobs v${VERSION}")
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            FLAGS+=(--prerelease)
          fi
          # Tag the bump commit when there was one — github.sha still points at
          # the pre-bump tree, and tagging that would ship a jar whose version
          # the tagged source does not declare.
          TARGET="${{ steps.bumpcommit.outputs.sha || github.sha }}"
          gh release create "v${VERSION}" dist/*.jar \
            --target "$TARGET" \
            "${FLAGS[@]}"
