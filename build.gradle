plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

configurations {
    runtimeMods {
        transitive = false
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Jobs+ and Arc, its holder framework whose types leak into the Jobs+ API.
    compileOnly files(
        "libs/26.3/jobsplus-fabric-${project.jobsplus_version}.jar",
        "libs/26.3/arc-fabric-${project.arc_version}.jar",
        "libs/26.3/knot-fabric-core-${project.knot_version}.jar",
        "libs/26.3/yamlconfig-fabric-${project.yamlconfig_version}.jar"
    )

    // Origins Legacy, Calio Legacy and the Cardinal Components modules.
    compileOnly files(
        "libs/26.3/Origins-Legacy-${project.origins_version}.jar",
        "libs/26.3/Calio-Legacy-${project.calio_version}.jar",
        "libs/26.3/cardinal-components-base-${project.cardinal_version}.jar",
        "libs/26.3/cardinal-components-entity-${project.cardinal_version}.jar"
    )

    // Dev runtime: Jobs+ and its libraries, Cardinal Components and the uproot shim.
    runtimeMods files(
        "libs/26.3/cardinal-components-api-${project.cardinal_version}.jar",
        "libs/26.3/jobsplus-fabric-${project.jobsplus_version}.jar",
        "libs/26.3/arc-fabric-${project.arc_version}.jar",
        "libs/26.3/knot-fabric-core-${project.knot_version}.jar",
        "libs/26.3/yamlconfig-fabric-${project.yamlconfig_version}.jar",
        "libs/26.3/uilib-fabric-${project.uilib_version}.jar",
        "libs/26.3/itemrestrictions-fabric-${project.itemrestrictions_version}.jar",
        "libs/26.3/mms-uproot-0.1.0.jar"
    )
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

processResources {
    // declare the version as an input so bumping gradle.properties
    // invalidates the task (expand values are not tracked automatically)
    inputs.property "mod_version", project.mod_version
    filesMatching("fabric.mod.json") {
        expand "version": project.mod_version
    }
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

// Mixin claims every class under a config's `package` and refuses to load
// anything there as a normal class (IllegalClassLoadError). A plain helper put
// in a mixin package compiles and packages cleanly and only explodes the first
// time it is touched at runtime, as a class-load crash in production. Fail the
// build instead.
def checkMixinPackages = tasks.register('checkMixinPackages', Exec) {
    dependsOn tasks.named('jar')
    doFirst {
        commandLine 'python3',
                "$projectDir/gradle/scripts/check-mixin-packages.py",
                tasks.named('jar').get().archiveFile.get().asFile
    }
}

tasks.named('build') { dependsOn checkMixinPackages }

// Copies the runtime mods into the dev run's mods folder.
tasks.register("syncRuntimeMods") {
    inputs.files(configurations.runtimeMods)
    doLast {
        copy {
            from configurations.runtimeMods
            into file("run/mods")
        }
    }
}

["runClient", "runServer"].each { runName ->
    tasks.named(runName) {
        dependsOn "syncRuntimeMods"
    }
}
